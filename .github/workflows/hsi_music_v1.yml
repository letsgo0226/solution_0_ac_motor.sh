name: hsi_music_v1

on:
  push:
    branches: [hsi-music-v1]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test HSI Music
        run: |
          sh -n hsi_music.sh
          cd hsi_music
          python3 -m unittest -v test_core.py
          cd ..
          sh hsi_music.sh "昴宿星團的藍"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("hsi_music.hsicert").read_text())
          o=json.loads(Path("hsi_music_object.json").read_text())
          assert c["protocol"]=="HSI-MUSIC/1.0" and c["closed"]==1
          assert c["checks"]["blue_preserved"] is True
          assert c["checks"]["lyrics_provenance"] is True
          assert Path("hsi_music.mid").read_bytes()[:4]==b"MThd"
          assert o["lyrics"]["origin"]=="generated-original"
          assert o["vocal_request"]["mode"]=="singing"
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ci_dummy.mp3")
          p.write_bytes(b"ID3"+b"\\0"*4096)
          print(p.resolve().as_uri())
          PY
          URL=$(python3 -c 'from pathlib import Path; print(Path("ci_dummy.mp3").resolve().as_uri())')
          sh hsi_music.sh --import-render "$URL" ci-test-task ci-test-renderer
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("hsi_music_render_receipt.json").read_text())
          c=json.loads(Path("hsi_music_render.hsicert").read_text())
          assert r["asset_bytes"] > 1024
          assert len(r["asset_sha256"]) == 64
          assert r["source_url_stored"] is False
          assert c["protocol"]=="HSI-MUSIC-RENDER/1.0"
          assert c["closed"]==1
          PY

          test "$(wc -c < hsi_music_2kb.sh)" -le 2048
          test "$(wc -l < hsi_music_2kb.sh)" -eq 1
          sh -n hsi_music_2kb.sh
          ! grep -Eiq 'sha|hashlib' hsi_music_2kb.sh
          ! grep -q '昴宿星團的藍' hsi_music_2kb.sh
          ! grep -q 'cinematic dream pop' hsi_music_2kb.sh
          rm -rf ci-hsi2k-local ci-hsi2k-render
          printf '月光 貓 回家\n' | HSI_OUT="$PWD/ci-hsi2k-local" sh hsi_music_2kb.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("ci-hsi2k-local/hsi2k.cert").read_text())
          assert c["p"]=="HSI-MUSIC-2K/1" and c["r"]==0 and c["c"]==1
          def D(n):
              a=[]
              while n>1:
                  n,r=divmod(n,257); a.append(r-1)
              return bytes(a[::-1])
          assert D(c["q"]).decode()=="月光 貓 回家"
          assert Path("ci-hsi2k-local/hsi2k.keywords").read_text()=="月光 貓 回家"
          assert "l" not in c
          assert not Path("ci-hsi2k-local/hsi2k.txt").exists()
          assert D(c["b"])==b"PLEIADIAN-BLUE"
          PY
          python3 - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler,HTTPServer
          AUDIO=b"ID3"+bytes(range(256))*20
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_POST(self):
                  n=int(self.headers.get("content-length","0"))
                  q=json.loads(self.rfile.read(n))
                  assert q["p"]=="HSI-MUSIC-2K/1" and q["v"]=="singing" and q["f"]=="mp3"
                  assert q["q"]=="可逆之歌" and q["a"]==1 and q["s"]==""
                  b=json.dumps({"status":"SUCCEEDED","url":"http://127.0.0.1:18765/song.mp3","lyrics":"可逆之歌，從關鍵字生成。"}).encode()
                  self.send_response(200);self.send_header("Content-Type","application/json");self.send_header("Content-Length",str(len(b)));self.end_headers();self.wfile.write(b)
              def do_GET(self):
                  self.send_response(200);self.send_header("Content-Type","audio/mpeg");self.send_header("Content-Length",str(len(AUDIO)));self.end_headers();self.wfile.write(AUDIO)
          HTTPServer(("127.0.0.1",18765),H).serve_forever()
          PY
          S=$!
          sleep 1
          HSI_OUT="$PWD/ci-hsi2k-render" HSI_RENDER_URL=http://127.0.0.1:18765/render sh hsi_music_2kb.sh "可逆之歌"
          kill $S || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("ci-hsi2k-render/hsi2k.cert").read_text())
          a=json.loads(Path("ci-hsi2k-render/hsi2k.e257").read_text())
          def D(n):
              x=[]
              while n>1:
                  n,r=divmod(n,257);x.append(r-1)
              return bytes(x[::-1])
          raw=Path("ci-hsi2k-render/hsi2k.mp3").read_bytes()
          assert c["p"]=="HSI-MUSIC-2K/1" and c["r"]==1 and c["c"]==1
          assert c["n"]==len(raw) and c["k"]==len(a)
          assert b"".join(D(n) for n in a)==raw
          assert D(c["l"]).decode()==Path("ci-hsi2k-render/hsi2k.txt").read_text()=="可逆之歌，從關鍵字生成。"
          PY
