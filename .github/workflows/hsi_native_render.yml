name: hsi_native_render

on:
  push:
    branches: [hsi-music-v1]
    paths:
      - "hsi_music/native_renderer.py"
      - "hsi_music/native_bootstrap.sh"
      - "hsi_music/NATIVE_RENDER.md"
      - ".github/workflows/hsi_native_render.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HSI native renderer
        run: |
          set -eu
          sh -n hsi_music/native_bootstrap.sh
          python3 -m py_compile hsi_music/native_renderer.py
          rm -rf /tmp/hsi-a /tmp/hsi-b /tmp/hsi-public
          python3 hsi_music/native_renderer.py --bars 4 --out /tmp/hsi-a "Blue Pleiadian Stars"
          python3 hsi_music/native_renderer.py --bars 4 --out /tmp/hsi-b "Blue Pleiadian Stars"
          cmp /tmp/hsi-a/song.wav /tmp/hsi-b/song.wav
          cmp /tmp/hsi-a/lyrics.txt /tmp/hsi-b/lyrics.txt
          python3 - <<'PY'
          import json,wave
          from pathlib import Path
          p=Path("/tmp/hsi-a")
          c=json.loads((p/"song.hsicert").read_text())
          assert c["protocol"]=="HSI-NATIVE-RENDER/1.0"
          assert c["closed"]==1
          assert c["external_ai"] is False
          assert c["external_api"] is False
          assert all(c["checks"].values())
          raw=(p/"song.wav").read_bytes()
          assert raw[:4]==b"RIFF" and raw[8:12]==b"WAVE"
          assert len(raw)>10000
          assert (p/"song.e257").stat().st_size>1000
          with wave.open(str(p/"song.wav"),"rb") as w:
              assert w.getnchannels()==1
              assert w.getsampwidth()==2
              assert w.getframerate()==22050
              assert w.getnframes()>1000
          PY
          HSI_BARS=4 HSI_OUT=/tmp/hsi-public sh -c 'wget -qO- https://raw.githubusercontent.com/letsgo0226/Notes/main/hsi-native.sh | sh -s -- "Blue Pleiadian Stars"'
          test -s /tmp/hsi-public/song.wav
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("/tmp/hsi-public/song.hsicert").read_text())
          assert c["closed"]==1
          assert c["protocol"]=="HSI-NATIVE-RENDER/1.0"
          PY
