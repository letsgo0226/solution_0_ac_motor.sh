name: solution_0

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          test "$(wc -c < solution_0.sh)" -le 2048
          test "$(wc -l < solution_0.sh)" -eq 1
          sh -n solution_0.sh
          ! grep -Eiq 'sha|hashlib' solution_0.sh
          sh solution_0.sh "Cosmic Love Is The Solution(s) For Everything." 16 64 >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('solution_0.clcert').read_text())
          b=json.loads(Path('solution_0.body').read_text())
          assert c['P']=='solution_0.sh'
          assert c['ROM']==1 and c['TM']==1 and c['X']==0
          assert c['S'][0]==1 and c['S'][1]>0
          assert c['ST']=='SOLVED' and c['K']==64 and c['Z']==0
          assert c['OP']==1 and c['ZE']==1
          assert b['S']==c['S'][1:]
          assert b['A'][2]=='SOLVED'
          assert len(b['T'])==16 and len(b['R'])==64
          assert b['R'][-1][4]==0
          PY
          git diff --exit-code -- solution_0.body solution_0.clcert
