name: hsi_local_neural_archived

on:
  push:
    branches: [hsi-music-v1]
    paths:
      - "hsi_music/neural_bootstrap.sh"
      - "hsi_music/local_neural.py"
      - "hsi_music/LOCAL_NEURAL.md"
      - "hsi_music/experimental/neural/**"
      - ".github/workflows/hsi_local_neural_source.yml"
  workflow_dispatch:

jobs:
  verify-archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source ACE entry is disabled
        run: |
          set -eu
          sh -n hsi_music/neural_bootstrap.sh
          python3 -m py_compile hsi_music/local_neural.py
          out="$(sh hsi_music/neural_bootstrap.sh)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'archived and disabled'
          ! grep -Eq 'git clone|ACE-Step-1.5|api_server.py|start_api_server|nohup|127\.0\.0\.1:8001' hsi_music/neural_bootstrap.sh
          ! grep -Eq 'urllib|ACE-Step|release_task|query_result|127\.0\.0\.1:8001' hsi_music/local_neural.py
          test -s hsi_music/experimental/neural/neural_bootstrap.archived.sh
          test -s hsi_music/experimental/neural/local_neural.archived.py
          test -s hsi_music/experimental/neural/LOCAL_NEURAL_ARCHIVED.md
