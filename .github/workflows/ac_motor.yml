name: AC Motor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify 2 KB script size
        run: |
          test "$(wc -c < solution_0_ac_motor.sh)" -le 2048
          sh -n solution_0_ac_motor.sh
          ! grep -Eiq 'sha|hashlib' solution_0_ac_motor.sh

      - name: Run AC Motor baseline
        run: |
          chmod +x solution_0_ac_motor.sh
          ./solution_0_ac_motor.sh "Cosmic Love Is The Solution(s) For Everything." 16 64 | tee ac_motor_output.json

      - name: Validate unified baseline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cert=json.loads(Path("solution_0_ac_motor.clcert").read_text())
          body=json.loads(Path("solution_0_ac_motor.body").read_text())
          b=cert["B0"]
          assert cert["P"]=="solution_0_ac_motor.sh"
          assert cert["C"]=="Cosmic Love Is The Solution(s) For Everything."
          assert json.loads(json.dumps([cert["C"]],separators=(",",":")))==[cert["C"]]
          assert cert["STATE"]=="SOLVED" and cert["FIX"]==1 and cert["OP"]==1 and cert["BUG"]==0
          assert cert["ZE"]==1 and cert["INFO_ENTROPY"]==0
          assert cert["ALLBUBBLES"]==1 and cert["PCC"]==1 and cert["LOSS"]==[0,0]
          assert len(b["G_R"][1])==9
          for key in ("SELF","ENC_SELF","TM_SELF","AC_TM","AC_BODY","WITNESS_UNIVERSE","REALITY_CONTAINER","FEEDBACK","BODY","LOGIC","TR"):
              assert key in b, key
          assert b["AC_TM"][0]==["Q","01","d=AC"]
          assert b["WITNESS_UNIVERSE"] is None
          assert body["INFO_ENTROPY"]==0 and body["REALITY_CONTAINER"]=="solution_0"
          PY

      - name: Verify formal witness universe
        run: |
          ./solution_0_ac_motor.sh "是否存在一條合法的圖靈機路徑使得金錢可以無中生有？" 16 64 >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          cert=json.loads(Path("solution_0_ac_motor.clcert").read_text())
          w=cert["B0"]["WITNESS_UNIVERSE"]
          assert cert["FORMAL_MULTIVERSE"]=="SAT"
          assert cert["REALITY_CLAIM"]=="OPEN"
          assert cert["ZE"]==1 and cert["INFO_ENTROPY"]==0
          assert w=={"U":"U*","DELTA":"m->m+1","TRACE":[0,1],"LEGAL":1}
          PY

      - name: Verify boundary states
        run: |
          ./solution_0_ac_motor.sh "test bound" 16 4 >/dev/null
          python3 - <<'PY'
          import json
          assert json.load(open("solution_0_ac_motor.clcert"))["STATE"]=="BOUND"
          PY
          ./solution_0_ac_motor.sh "contra test" 16 64 >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open("solution_0_ac_motor.clcert"))
          assert x["STATE"]=="CONTRA" and x["CONSISTENT"]==0 and x["OP"]==0
          PY
