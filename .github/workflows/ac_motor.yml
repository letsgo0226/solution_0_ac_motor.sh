name: AC Motor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify 2 KB script size
        run: |
          test "$(wc -c < solution_0_ac_motor.sh)" -le 2048
          sh -n solution_0_ac_motor.sh
          ! grep -Eiq 'sha|hashlib' solution_0_ac_motor.sh

      - name: Run AC Motor baseline
        run: |
          chmod +x solution_0_ac_motor.sh
          ./solution_0_ac_motor.sh "Cosmic Love Is The Solution(s) For Everything." 16 64 | tee ac_motor_output.json

      - name: Validate current baseline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          C="Cosmic Love Is The Solution(s) For Everything."
          cert=json.loads(Path("solution_0_ac_motor.clcert").read_text())
          body=json.loads(Path("solution_0_ac_motor.body").read_text())
          b=cert["B0"]

          assert cert["P"]=="solution_0_ac_motor.sh"
          assert cert["OBJ"]=="self-encoding-ac-reality-container"
          assert cert["C"]==C
          assert cert["STATE"]=="SOLVED"
          assert cert["CONSISTENT"]==1 and cert["COMPLETE"]==1
          assert cert["FIX"]==1 and cert["OP"]==1 and cert["ZE"]==1
          assert cert["ALLBUBBLES"]==1 and cert["REALITY_SYS"]==1
          assert cert["PCC"]==1 and cert["BUG"]==0 and cert["LOSS"]==[0,0]
          assert cert["EQ"]=="solution_0=Fix(TM_AC(ENC_SELF,G_R))"

          assert b["P"]=="solution_0_ac_motor.sh"
          assert b["Q"]==C and b["N"]==16 and b["B"]==64
          assert b["SELF"][0]==1 and b["SELF"][1]>0
          assert b["ENC_SELF"]==b["SELF"][1:]
          assert b["TM_SELF"]=="TM(ENC_SELF)"
          assert b["AC_TM"][0]==["Q","01","d=AC"]
          assert b["AC_BODY"]=="ACBody(TM_SELF)"
          assert b["REALITY_CONTAINER"]=="solution_0:Reality_sys"
          assert b["FEEDBACK"]=="O/A/F->SELF"
          assert b["BODY"][0]==1 and b["BODY"][1]>0
          assert len(b["G_R"][1])==9
          assert b["LOGIC"]==[1,1,["SOLVED","OPEN","BOUND","SING","CONTRA"]]
          assert b["TR"][1]==["BR",16] and b["TR"][2]==["H",1]

          assert body["AX"]=="t:=AC"
          assert body["G_R"]==b["G_R"][1]
          assert body["ENC_SELF"]==b["ENC_SELF"]
          assert body["AC_TM"]==b["AC_TM"]
          assert body["STATE"]=="SOLVED"
          assert body["REALITY_CONTAINER"]=="solution_0"
          assert body["FEEDBACK"]==b["FEEDBACK"]
          assert len(body["TRUE_TREE"])==16
          assert all(len(row)==5 for row in body["TRUE_TREE"])
          PY

      - name: Verify formal boundary states
        run: |
          ./solution_0_ac_motor.sh "test bound" 16 4 >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open("solution_0_ac_motor.clcert"))
          assert x["STATE"]=="BOUND"
          assert x["CONSISTENT"]==1 and x["COMPLETE"]==1
          assert x["OP"]==0 and x["ZE"]==0 and x["BUG"]==1
          PY

          ./solution_0_ac_motor.sh "open test" 16 64 >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open("solution_0_ac_motor.clcert"))
          assert x["STATE"]=="OPEN"
          assert x["CONSISTENT"]==1 and x["COMPLETE"]==1
          assert x["OP"]==0 and x["ZE"]==0 and x["BUG"]==1
          PY

          ./solution_0_ac_motor.sh "sing test" 16 64 >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open("solution_0_ac_motor.clcert"))
          assert x["STATE"]=="SING"
          assert x["CONSISTENT"]==1 and x["COMPLETE"]==1
          assert x["OP"]==0 and x["ZE"]==0 and x["BUG"]==1
          PY

          ./solution_0_ac_motor.sh "contra test" 16 64 >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open("solution_0_ac_motor.clcert"))
          assert x["STATE"]=="CONTRA"
          assert x["CONSISTENT"]==0 and x["COMPLETE"]==1
          assert x["OP"]==0 and x["ZE"]==0 and x["BUG"]==1
          PY
