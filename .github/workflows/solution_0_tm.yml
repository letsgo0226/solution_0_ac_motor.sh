name: solution_0_tm

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          test "$(wc -c < solution_0_tm.sh)" -le 2048
          test "$(wc -l < solution_0_tm.sh)" -eq 1
          sh -n solution_0_tm.sh
          ! grep -Eiq 'sha|hashlib' solution_0_tm.sh
          sh solution_0_tm.sh "Cosmic Love Is The Solution(s) For Everything." 16 64 >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('solution_0_tm.clcert').read_text())
          b=json.loads(Path('solution_0_tm.body').read_text())
          assert c['P']=='solution_0_tm.sh'
          assert c['TM']==1 and c['AC']==1 and c['X']==0
          assert c['S'][0]==1 and c['S'][1]>0
          assert c['K']==64 and c['Z']==0
          assert c['OP']==1 and c['ZE']==1
          assert c['BD']=='Formal self-encoding TM/AC fixed-point only.'
          assert b['S']==c['S'][1:]
          assert b['O']=='D(A(T(E(S))))'
          assert len(b['T'])==64
          assert all(x[6]==0 for x in b['T'])
          PY
          git diff --exit-code -- solution_0_tm.body solution_0_tm.clcert
