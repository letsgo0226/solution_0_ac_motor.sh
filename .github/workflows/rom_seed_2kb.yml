name: ROM Seed 2KB

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify single-file 2 KB seed
        run: |
          test "$(wc -c < solution_0_rom_seed_2kb.sh)" -le 2048
          test "$(wc -l < solution_0_rom_seed_2kb.sh)" -eq 1
          sh -n solution_0_rom_seed_2kb.sh
          ! grep -Eiq 'sha|hashlib' solution_0_rom_seed_2kb.sh

      - name: Run ROM seed ontology
        run: |
          sh solution_0_rom_seed_2kb.sh "Cosmic Love Is The Solution(s) For Everything." 16 64 | tee rom_seed_output.json

      - name: Validate ROM seed certificate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cert=json.loads(Path("solution_0_rom_seed_2kb.clcert").read_text())
          body=json.loads(Path("solution_0_rom_seed_2kb.body").read_text())

          assert cert["P"]=="solution_0_rom_seed_2kb.sh"
          assert cert["OBJ"]=="single-file-hardware-rom-tm-ontology"
          assert cert["HARDWARE_ROM"]==1
          assert cert["INDEPENDENT"]==1
          assert cert["EXTERNAL_FILES"]==0
          assert cert["SELF"][0]==1 and cert["SELF"][1]>0
          assert cert["AC_STATE"]=="SOLVED"
          assert cert["GOALS"]==["AC_MOTOR","ANALYTIC_TM","BUBBLE_SPACE","REPO_TM"]
          assert cert["TM_STEP"]==64
          assert cert["ZERO"]==0
          assert cert["OP"]==1 and cert["ZE"]==1
          assert "formal encoding only" in cert["BOUNDARY"]

          assert body["AX"]=="rom_seed_tm"
          assert body["SELF"]==cert["SELF"][1:]
          assert body["AC"][3]=="SOLVED"
          assert len(body["TREE"])==16
          assert len(body["RUN"])==64
          assert body["RUN"][-1][4]==0
          PY

      - name: Validate committed baseline stability
        run: |
          git diff --exit-code -- solution_0_rom_seed_2kb.body solution_0_rom_seed_2kb.clcert
