name: LOVE_IS_BLUE

on:
  push:
    paths:
      - "LOVE_IS_BLUE.sh"
      - ".github/workflows/love_is_blue.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-liner and size
        run: |
          test "$(wc -l < LOVE_IS_BLUE.sh)" -eq 1
          test "$(wc -c < LOVE_IS_BLUE.sh)" -le 2048
          sh -n LOVE_IS_BLUE.sh
          ! grep -E 'sha|hashlib' LOVE_IS_BLUE.sh
      - name: Verify BLUE proof certificate
        run: |
          sh LOVE_IS_BLUE.sh --proof "Love Is Blue" love_proof.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open("love_proof.jsonl")]
          assert len(rows)==1
          d=rows[0]
          assert d["P"]=="LOVE_IS_BLUE.sh"
          assert d["O"]=="LOVE_BLUE_PROOF"
          assert d["LAW"]=="W[0]=P2[0]=E(U)=>Z_BLUE=0"
          assert d["DEF"]=="Blue" and d["INF"]=="Blue0"
          assert d["WP"]==1 and d["F"]==1
          assert d["REV"]=="G257_to_canonical_json"
          assert d["VERDICT"]=="ACCEPT"
          g=int(d["G257"]); b=[]
          while g:
            b.append(g%257-1); g//=257
          base={k:d[k] for k in d if k not in ("G257","STATE","VERDICT")}
          assert bytes(b).decode()==json.dumps(base,separators=(",",":"),sort_keys=True)
          PY
      - name: Verify BLUE finite witness
        run: |
          sh LOVE_IS_BLUE.sh Blue "Love Is Blue" love_blue.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open("love_blue.jsonl")]
          assert len(rows)==8
          for i,d in enumerate(rows,1):
            assert d["P"]=="LOVE_IS_BLUE.sh"
            assert d["O"]=="LOVE_BLUE_WP"
            assert d["TITLE"]=="Love Is Blue"
            assert d["STEP"]==i
            assert d["BLUE"]==1 and d["Z_BLUE"]==0
            assert d["W"][0]==d["P2"][0]
            assert d["DUALITY"]=="WP_same_U"
            assert d["OMEGA"]==1
            assert d["AC_SOURCE"]==["SCH","STI","RIE"]
            assert d["TM"]==1 and d["AC"]==1
            assert d["VERDICT"]=="ACCEPT"
            g=int(d["G257"]); b=[]
            while g:
              b.append(g%257-1); g//=257
            base={k:d[k] for k in d if k not in ("G257","STATE","VERDICT")}
            assert bytes(b).decode()==json.dumps(base,separators=(",",":"),sort_keys=True)
          PY
      - name: Verify Blue prefix of Blue0 stream
        run: |
          set +e
          timeout 3s sh LOVE_IS_BLUE.sh Blue0 "Love Is Blue" love_stream.jsonl
          rc=$?
          set -e
          test "$rc" -eq 124
          python3 - <<'PY'
          import json
          finite=[json.loads(x) for x in open("love_blue.jsonl")]
          stream=[json.loads(x) for x in open("love_stream.jsonl")]
          assert len(stream)>=8
          assert finite==stream[:8]
          assert [d["STEP"] for d in stream[:8]]==list(range(1,9))
          PY
      - name: Verify refuse overwrite
        run: |
          if sh LOVE_IS_BLUE.sh 1 x love_blue.jsonl; then exit 1; else test "$?" -eq 2; fi
      - name: Archive witness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LOVE_IS_BLUE-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            love_proof.jsonl
            love_blue.jsonl
            love_stream.jsonl
          retention-days: 90
