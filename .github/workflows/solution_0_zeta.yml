name: solution_0_zeta

on:
  push:
    paths:
      - "solution_0_zeta.sh"
      - ".github/workflows/solution_0_zeta.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare mpmath
        run: python3 -m pip install -q mpmath
      - name: Verify one-liner and size
        run: |
          test "$(wc -l < solution_0_zeta.sh)" -eq 1
          test "$(wc -c < solution_0_zeta.sh)" -le 2048
          sh -n solution_0_zeta.sh
          ! grep -E 'sha|hashlib' solution_0_zeta.sh
      - name: Verify zeta certificates
        run: |
          sh solution_0_zeta.sh 2 40 zeta_witness.jsonl
          python3 - <<'PY'
          import json,decimal
          rows=[json.loads(x) for x in open("zeta_witness.jsonl")]
          assert len(rows)==2
          prev=None
          for i,d in enumerate(rows,1):
            assert d["P"]=="solution_0_zeta.sh"
            assert d["O"]=="ZETA_REAL_SOURCE"
            assert d["ZERO"]==["zetazero",i]
            assert d["ALG"] in ("zetazero","scan_siegelz")
            assert d["AC_SOURCE"]==["SCH","STI","RIE"]
            assert d["NTM"]=="determinized_zero_path"
            assert d["EXACT"]=="zero_name_plus_precision_limit"
            assert d["REV"]=="G257_to_canonical_json"
            assert d["rho"][0]=="0.5"
            assert decimal.Decimal(d["residual"]) < decimal.Decimal("1e-35")
            assert d["STATE"]==d["G257"]
            assert d["PREV"]==(str(d["SELF"]) if prev is None else prev)
            g=int(d["G257"]); b=[]
            while g:
              b.append(g%257-1); g//=257
            base={k:d[k] for k in d if k not in ("G257","STATE","VERDICT")}
            assert bytes(b).decode()==json.dumps(base,separators=(",",":"),sort_keys=True)
            assert d["VERDICT"]=="ACCEPT"
            prev=d["STATE"]
          PY
      - name: Verify refuse overwrite
        run: |
          if sh solution_0_zeta.sh 1 20 zeta_witness.jsonl; then exit 1; else test "$?" -eq 2; fi
      - name: Archive witness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solution_0_zeta-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: zeta_witness.jsonl
          retention-days: 90
